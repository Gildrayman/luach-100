<style>
/* Layout: one tear-off calendar sheet centered on an olive field, giant day number on top, quote under it, flip button below */
:root{
  --bg:#e6e4d6; --sheet:#fbfaf4; --fg:#23271c; --muted:#646a55;
  --olive:#4d5a2c; --olive-ink:#f4f2e4; --sand:#c9a65a; --line:#d5d2bf;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a12; --sheet:#22261b; --fg:#ecebdf; --muted:#a3a890;
  --olive:#8a9b52; --olive-ink:#141710; --sand:#d8b86c; --line:#363b2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a12; --sheet:#22261b; --fg:#ecebdf; --muted:#a3a890;
  --olive:#8a9b52; --olive-ink:#141710; --sand:#d8b86c; --line:#363b2b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;

  padding-block:24px;display:flex;flex-direction:column;align-items:center;gap:20px;box-sizing:border-box}
header{text-align:center;display:grid;gap:2px}
header .eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--olive)}
.pad{position:relative;width:100%;max-width:440px}
.rings{display:flex;justify-content:space-around;padding:0 40px;position:relative;z-index:2;height:14px}
.rings span{width:12px;height:26px;border-radius:6px;background:var(--fg);opacity:.75;margin-top:-6px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;box-shadow:0 14px 30px -18px rgba(0,0,0,.45),0 2px 0 var(--line),0 5px 0 -1px var(--sheet),0 6px 0 -1px var(--line);
  overflow:hidden;transform-origin:top center}
.band{background:var(--olive);color:var(--olive-ink);text-align:center;padding:12px 16px 10px;font-weight:700;letter-spacing:.06em;font-size:14px}
.num{font-family:var(--display);font-size:clamp(120px,40vw,200px);line-height:1;text-align:center;color:var(--fg);
  font-variant-numeric:tabular-nums;padding-top:18px}
.unit{text-align:center;color:var(--muted);font-weight:600;margin-top:-4px;font-size:18px}
.date{text-align:center;color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.quote{margin:20px 22px 26px;padding-top:18px;border-top:1px dashed var(--line);text-align:center;
  font-size:21px;line-height:1.5;font-weight:600;text-wrap:balance;min-height:3em}
.quote small{display:block;margin-top:10px;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.04em}
.sheet.tear{animation:tear .45s ease-in forwards}
.sheet.enter{animation:enter .3s ease-out}
@keyframes tear{to{transform:translateY(40px) rotate(-7deg);opacity:0}}
@keyframes enter{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet.tear,.sheet.enter{animation:none}}
.controls{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:440px}
#flip{width:100%;font-family:var(--display);font-size:26px;padding:14px 20px;border:0;border-radius:10px;
  background:var(--olive);color:var(--olive-ink);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--olive) 60%,#000)}
#flip:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--olive) 60%,#000)}
#flip:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.small{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.confirm{display:flex;gap:8px;align-items:center}
.confirm button{font:inherit;font-size:14px;border-radius:6px;padding:4px 12px;cursor:pointer;border:1px solid var(--line);background:var(--sheet);color:var(--fg)}
.confirm .yes{background:var(--sand);border-color:var(--sand);color:#23271c}
.progress{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sand);width:0;transition:width .4s}
</style>

</head>

<div dir="rtl" lang="he" style="display:contents">
<header>

const START_LINE = "100 ימים לסיום שלב גפן. מכאן זה רק ירידה. סתם, זה בעיקר עליות.";
const TARGET = new Date(2027,1,18);
const DAY = 86400000;
const $ = id => document.getElementById(id);
function fmt(d){ return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear(); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function daysLeft(){ return Math.round((TARGET-today())/DAY); }

let extra = 0; // how many extra sentences were flipped today (not saved, resets on reload)
let shownDay = null;

function render(){
  const real = daysLeft();
  const count = Math.max(0, Math.min(100, real));
  if(shownDay!==count){ shownDay=count; extra=0; }
  $("num").textContent = count;
  if(count===0){
    $("band").textContent = real<0 ? "סיימת את שלב גפן" : "יום הסיום";
    $("unit").textContent = "הגעת!";
  }else{
    $("band").textContent = real>100 ? "הלוח נפתח ב־"+fmt(new Date(TARGET-100*DAY)) : "ספירה לאחור";
    $("unit").textContent = count===1 ? "יום אחד" : "ימים";
  }
  $("date").textContent = real>100
    ? "עוד "+real+" ימים ליעד · "+fmt(TARGET)
    : "היום "+fmt(today())+" · יעד "+fmt(TARGET);
  // sentence of the day: 100 -> start line, 99 -> LINES[0] ... 0 -> LINES[99]
  const base = 100-count; // 0..100
  const idx = (base + extra) % 101;
  const line = idx===0 ? START_LINE : LINES[idx-1];
  $("quote").innerHTML = "";
  $("quote").append(line);
  const s=document.createElement("small");
  s.textContent = extra===0 ? "המשפט של היום" : "משפט נוסף לדרך";
  $("quote").append(s);
  $("bar").style.width = (100-count)+"%";
  $("status").textContent = "הספירה מתעדכנת אוטומטית כל לילה בחצות. ״דפדף״ נותן עוד משפט.";
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animate(update){
  const sh = $("sheet");
  if(reduce){ update(); return; }
  sh.classList.remove("enter"); sh.classList.add("tear");
  setTimeout(()=>{ update(); sh.classList.remove("tear"); void sh.offsetWidth; sh.classList.add("enter"); },430);
}

let busy=false;
$("flip").addEventListener("click",()=>{
  if(busy) return; busy=true;
  animate(()=>{ extra++; render(); busy=false; });
});

// refresh right after midnight if the page stays open, and when coming back to the tab
function scheduleMidnight(){
  const n=new Date(); const next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,2);
  setTimeout(()=>{ animate(render); scheduleMidnight(); }, next-n);
}
